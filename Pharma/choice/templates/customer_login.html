{% extends 'base.html' %}
{% block title %}Customer Login | PharmaChoice{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(135deg,var(--dark) 0%,var(--dark2) 100%);">
    <div style="background:var(--white);border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3);">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="font-size:48px;margin-bottom:12px;">👤</div>
            <h2 style="font-family:'Sora',sans-serif;color:var(--dark);font-size:24px;margin-bottom:4px;">Welcome Back</h2>
            <p style="color:var(--muted);font-size:14px;">Login to your PharmaChoice account</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@email.com" required autofocus />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;margin-top:8px;">Login</button>
        </form>
        <p style="text-align:center;color:var(--muted);font-size:14px;margin-top:20px;">
            Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--em);font-weight:700;">Register Free</a>
        </p>
    </div>
</div>
{% endblock %}
