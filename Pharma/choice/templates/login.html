{% extends 'base.html' %}
{% block title %}Admin Login | PharmaChoice{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(135deg,var(--dark) 0%,var(--dark2) 100%);">
    <div style="background:var(--white);border-radius:20px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3);">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="font-size:48px;margin-bottom:12px;">⚕️</div>
            <h2 style="font-family:'Sora',sans-serif;color:var(--dark);font-size:24px;margin-bottom:4px;">Admin Login</h2>
            <p style="color:var(--muted);font-size:14px;">PharmaChoice Admin Panel</p>
        </div>
        <form method="POST" action="{{ url_for('login') }}">
            <!-- Hidden role field required by app.py -->
            <input type="hidden" name="role" value="Admin">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="admin" required autofocus />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;margin-top:8px;">
                Login to Dashboard
            </button>
        </form>
    </div>
</div>
{% endblock %}
