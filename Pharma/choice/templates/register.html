{% extends 'base.html' %}
{% block title %}Register | PharmaChoice{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;">
    <div style="background:var(--white);border-radius:20px;padding:44px 40px;width:100%;max-width:480px;box-shadow:var(--cs);border:1px solid var(--border);">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="font-size:48px;margin-bottom:12px;">💊</div>
            <h2 style="font-family:'Sora',sans-serif;color:var(--dark);font-size:24px;margin-bottom:4px;">Create Account</h2>
            <p style="color:var(--muted);font-size:14px;">Join PharmaChoice — free forever</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Your full name" required />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@email.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Choose a strong password" required />
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="+91 9876543210" />
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;margin-top:8px;">Create My Account</button>
        </form>
        <p style="text-align:center;color:var(--muted);font-size:14px;margin-top:20px;">
            Already have an account? <a href="{{ url_for('customer_login') }}" style="color:var(--em);font-weight:700;">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
