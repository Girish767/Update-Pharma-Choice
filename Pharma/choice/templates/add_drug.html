{% extends 'base.html' %}
{% block title %}Add Drug | Pharma Choice{% endblock %}
{% block content %}
<div class="container" style="max-width:700px;">
    <h1>Add Drug</h1>
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Drug Name *</label>
                <input type="text" name="name" placeholder="e.g. Paracetamol" required />
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select name="category_id" required>
                    <option value="">-- Select Category --</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group">
                    <label>Price (₹) *</label>
                    <input type="number" name="price" min="0" step="0.01" placeholder="e.g. 25.00" required />
                </div>
                <div class="form-group">
                    <label>Discount (%)</label>
                    <input type="number" name="discount" min="0" max="100" step="0.1" value="0" />
                </div>
            </div>
            <div class="form-group">
                <label>Stock Quantity *</label>
                <input type="number" name="stock" min="0" placeholder="e.g. 100" required />
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3" placeholder="Brief description of the drug..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;">Add Drug</button>
        </form>
    </div>
</div>
{% endblock %}
