{% extends 'base.html' %}
{% block title %}Add Category | Pharma Choice{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
    <h1>Add Category</h1>
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Enter Category Name</label>
                <input type="text" name="name" placeholder="e.g. Antibiotics" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;">Save Category</button>
        </form>
    </div>
</div>
{% endblock %}
